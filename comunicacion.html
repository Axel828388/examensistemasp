<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicación Interna RRHH</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('img/fondo.png') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            padding: 40px 32px;
            width: 520px;
            max-width: 95vw;
        }
        .logo {
            width: 120px;
            display: block;
            margin: 0 auto 18px auto;
        }
        h2 {
            color: #1a2a3a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #5a6a7a;
            font-size: 15px;
            margin-bottom: 22px;
            text-align: center;
        }
        .section {
            margin-bottom: 24px;
        }
        .section h3 {
            color: #0056b3;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #0056b3 60%, #0083b3 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 17px;
            font-weight: bold;
            margin-top: 18px;
        }
        .btn:hover {
            background: linear-gradient(90deg, #004494 60%, #006e94 100%);
        }
        .anuncio {
            background: #f4f8fc;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
            color: #333;
        }
        .chat {
            background: #f4f8fc;
            border-radius: 8px;
            padding: 12px;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .mensaje {
            background: #e0f7fa;
            border-radius: 6px;
            padding: 6px 10px;
            margin-bottom: 6px;
            color: #333;
        }
        .event {
            background: #f4f8fc;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
            color: #333;
        }
        .noticia {
            background: #f4f8fc;
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
            color: #333;
        }
        input, textarea {
            border-radius: 6px;
            border: 1px solid #d0d0d0;
            font-size: 15px;
            padding: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="panel">
        <img src="img/logo.png" alt="Logotipo RRHH" class="logo">
        <h2>Comunicación Interna</h2>
        <div class="subtitle">Anuncios, chat, eventos y noticias de la empresa</div>

        <!-- Anuncios oficiales -->
        <div class="section">
            <h3>Anuncios oficiales</h3>
            <form id="anuncioForm">
                <input type="text" name="anuncio" placeholder="Nuevo anuncio..." required>
                <button type="submit" class="btn">Publicar anuncio</button>
            </form>
            <div id="anunciosList">
                <!-- JS rellena -->
            </div>
        </div>

        <!-- Sistema de mensajería interna (chat) -->
        <div class="section">
            <h3>Mensajería interna (chat)</h3>
            <div class="chat" id="chatBox">
                <!-- JS rellena -->
            </div>
            <form id="chatForm">
                <input type="text" name="mensaje" placeholder="Escribe un mensaje..." required>
                <button type="submit" class="btn">Enviar</button>
            </form>
        </div>

        <!-- Calendario de eventos -->
        <div class="section">
            <h3>Calendario de eventos</h3>
            <form id="eventoForm">
                <input type="text" name="evento" placeholder="Nuevo evento..." required>
                <input type="date" name="fecha" required>
                <button type="submit" class="btn">Agregar evento</button>
            </form>
            <div id="eventosList">
                <!-- JS rellena -->
            </div>
        </div>

        <!-- Noticias de la empresa -->
        <div class="section">
            <h3>Noticias de la empresa</h3>
            <form id="noticiaForm">
                <textarea name="noticia" placeholder="Nueva noticia..." required></textarea>
                <button type="submit" class="btn">Publicar noticia</button>
            </form>
            <div id="noticiasList">
                <!-- JS rellena -->
            </div>
        </div>

        <button class="btn" onclick="goPanel()">Volver al panel principal</button>
    </div>

    <script>
    // Datos simulados / fallback
    const API_BASE = 'http://127.0.0.1:3000';
    let anuncios = [
        'Bienvenidos al nuevo sistema RRHH.',
        'Recuerden actualizar sus documentos.'
    ];
    let chat = [
        {usuario:'Juan', mensaje:'Hola a todos!'},
        {usuario:'Ana', mensaje:'¿Alguien sabe sobre el evento de mañana?'}
    ];
    let eventos = [
        {evento:'Reunión general', fecha:'2026-03-20'},
        {evento:'Capacitación', fecha:'2026-03-25'}
    ];
    let noticias = [
        'La empresa ha sido reconocida por su clima laboral.',
        'Nuevo programa de beneficios para empleados.'
    ];

    // Anuncios
    document.getElementById('anuncioForm').onsubmit = async function(e) {
        e.preventDefault();
        const anuncio = this.anuncio.value.trim();
        if(!anuncio) return;
        try {
            const res = await fetch(API_BASE + '/api/announcements', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: anuncio }) });
            if (res.ok) { renderAnuncios(); this.reset(); return; }
        } catch (err) {}
        anuncios.unshift(anuncio);
        renderAnuncios();
        this.reset();
    };
    function renderAnuncios() {
        const list = document.getElementById('anunciosList');
        list.innerHTML = anuncios.length ? anuncios.map(a => `<div class='anuncio'>${a}</div>`).join('') : 'Sin anuncios.';
    }

    // Chat
    document.getElementById('chatForm').onsubmit = function(e) {
        e.preventDefault();
        const mensaje = this.mensaje.value.trim();
        if(mensaje) {
            chat.push({usuario:'Tú', mensaje});
            renderChat();
            this.reset();
        }
    };
    function renderChat() {
        const box = document.getElementById('chatBox');
        box.innerHTML = chat.length ? chat.map(c => `<div class='mensaje'><b>${c.usuario}:</b> ${c.mensaje}</div>`).join('') : 'Sin mensajes.';
        box.scrollTop = box.scrollHeight;
    }

    // Eventos
    document.getElementById('eventoForm').onsubmit = function(e) {
        e.preventDefault();
        const evento = this.evento.value.trim();
        const fecha = this.fecha.value;
        if(evento && fecha) {
            eventos.push({evento, fecha});
            renderEventos();
            this.reset();
        }
    };
    function renderEventos() {
        const list = document.getElementById('eventosList');
        list.innerHTML = eventos.length ? eventos.map(ev => `<div class='event'>${ev.evento} <span style='color:#888;font-size:14px;'>(${ev.fecha})</span></div>`).join('') : 'Sin eventos.';
    }

    // Noticias
    document.getElementById('noticiaForm').onsubmit = function(e) {
        e.preventDefault();
        const noticia = this.noticia.value.trim();
        if(noticia) {
            noticias.unshift(noticia);
            renderNoticias();
            this.reset();
        }
    };
    function renderNoticias() {
        const list = document.getElementById('noticiasList');
        list.innerHTML = noticias.length ? noticias.map(n => `<div class='noticia'>${n}</div>`).join('') : 'Sin noticias.';
    }

    // Inicialización
    window.onload = function() {
        renderAnuncios();
        renderChat();
        renderEventos();
        renderNoticias();
    };

    // Ir al panel principal preservando sesión (incluye user en la URL para compatibilidad WebView)
    function goPanel() {
        try {
            const current = localStorage.getItem('currentUser') || localStorage.getItem('rememberedUser') || 'user';
            if (current) localStorage.setItem('currentUser', current);
            const user = encodeURIComponent(current || 'user');
            window.location.href = 'login3.html?user=' + user + '#panel';
        } catch (e) {
            window.location.href = 'login3.html#panel';
        }
    }
    </script>
</body>
</html>
