<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Web - Sensores y Hardware</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mapa estático: no necesita Leaflet -->
    <style>
        body { font-family: 'Inter', Arial, sans-serif; margin: 0; min-height: 100vh; background: linear-gradient(180deg, #e8f4ff 0%, #f6fbff 60%); color: #172b4d; }
        .container { max-width: 760px; margin: 0 auto; padding: 30px 16px 40px; display: grid; gap: 24px; }
        .card { background: rgba(255,255,255,0.96); border-radius: 22px; padding: 24px; box-shadow: 0 24px 60px rgba(21, 60, 99, 0.08); border: 1px solid rgba(30, 90, 150, 0.08); }
        h1 { text-align: center; margin: 0; font-size: 32px; letter-spacing: -0.03em; }
        h2 { text-align: left; margin: 0 0 18px; font-size: 20px; color: #0d3b66; }
        .subtitle { max-width: 620px; margin: 0 auto; text-align: center; font-size: 15px; color: #4b647d; }
        button { background: #1c7ed6; color: white; border: none; padding: 12px 22px; border-radius: 999px; cursor: pointer; margin: 6px 6px 0 0; font-size: 15px; transition: transform .18s ease, background .18s ease; }
        button:hover { background: #1864ab; transform: translateY(-1px); }
        button:disabled { background: #bfc0c4; cursor: not-allowed; transform: none; }
        pre { background: #f5fbff; padding: 16px; border-radius: 18px; white-space: pre-wrap; font-family: 'Courier New', monospace; border: 1px solid rgba(30, 115, 190, 0.12); color: #1f426a; }
        video, canvas { width: 100%; max-width: 100%; height: auto; border-radius: 18px; margin: 12px 0; background: #000; }
        canvas { display: none; }
        .demo-toggle { display: none; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .map-card { position: relative; min-height: 360px; overflow: hidden; border-radius: 20px; border: 1px solid rgba(28, 126, 214, 0.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6); }
        #mapWrapper { display: none; width: 100%; min-height: 360px; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at top, rgba(7, 62, 120, 0.06), transparent 52%), #edf6ff; }
        #mapWrapper iframe { width: 100%; height: 100%; border: 0; }
        .osm-link { position: absolute; right: 14px; bottom: 14px; background: rgba(255,255,255,0.92); color: #0d3b66; text-decoration: none; padding: 8px 12px; border-radius: 999px; font-size: 13px; box-shadow: 0 8px 18px rgba(20, 50, 90, 0.08); }
        .status-label { display: inline-flex; align-items: center; gap: 8px; color: #0d3b66; font-weight: 600; margin-bottom: 12px; }
        .tag { background: rgba(28,126,214,0.12); color: #0f4c81; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
        .video-card { display: grid; gap: 16px; }
        .video-card video, .video-card canvas { max-height: 340px; }
        .back-link { text-align: center; }
        .back-link button { width: 100%; max-width: 320px; }
        @media (max-width: 650px) { .container { padding: 18px 12px 30px; } .card { padding: 18px; } .controls { flex-direction: column; } button { width: 100%; } }
        #mapWrapper { display: none; width: 100%; max-width: 520px; height: 360px; border-radius: 10px; margin: 10px auto 0; overflow: hidden; position: relative; box-shadow: 0 6px 18px rgba(20,30,50,0.06); border: 1px solid rgba(20,30,50,0.04); }
        #map { width: 100%; height: 100%; display: block; }
        /* Mantener el contenedor de Leaflet contenido y evitar que tiles queden fuera */
        .leaflet-container { position: relative !important; z-index: 0 !important; max-width: 100% !important; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        /* Pin centrado sobre la imagen estática */
        .static-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); width: 28px; height: 28px; background: radial-gradient(circle at 40% 35%, #fff 0 20%, rgba(255,255,255,0) 21%), #c0392b; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.25); border: 3px solid rgba(255,255,255,0.9); pointer-events: none; z-index: 2; }
        #mapWrapper img { display: block; width: 100%; height: 100%; object-fit: cover; }
        #mapWrapper { position: relative; }
        @media (max-width: 600px) { .container { padding: 10px; } .card { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Integración de Sensores y Hardware</h1>

        <!-- Parte A: Geolocalización -->
        <div class="card">
            <div class="status-label"><span class="tag">GPS</span> Geolocalización en tiempo real</div>
            <h2>Geolocalización</h2>
            <div class="controls">
                <button id="getLocation">Obtener ubicación</button>
                <button id="startTracking">Iniciar seguimiento</button>
                <button id="stopTracking" disabled>Detener seguimiento</button>
            </div>
            <pre id="locationData">Los datos de ubicación aparecerán aquí.</pre>
            <div id="mapWrapper" class="map-card"><div id="map"></div></div>
        </div>

        <!-- Parte C: Cámara y Micrófono -->
        <div class="card">
            <h2>Cámara y Micrófono</h2>
            <button id="startCamera">Activar Cámara</button>
            <button id="stopCamera" disabled>Detener Cámara</button>
            <button id="captureImage" disabled>Capturar Imagen</button>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
        </div>

        <button onclick="goPanel()">Volver al panel principal</button>
    </div>

    <!-- Leaflet eliminado: usamos imagen estática del mapa -->
    <script>
        // Variables globales
        let watchId = null;
        let stream = null;
        let positions = [];
        const API_BASE = 'http://127.0.0.1:3000';

        // Static embed via OpenStreetMap iframe to ensure consistent rendering
        function showStaticMap(lat, lng, accuracy) {
            const wrapper = document.getElementById('mapWrapper');
            if (!wrapper) return;
            // compute a small bbox around the point
            const deltaLat = 0.006; // ~700m
            const deltaLng = 0.006 / Math.max(0.2, Math.cos(lat * Math.PI / 180));
            const minLat = lat - deltaLat; const maxLat = lat + deltaLat;
            const minLng = lng - deltaLng; const maxLng = lng + deltaLng;
            const bbox = `${minLng},${minLat},${maxLng},${maxLat}`;
            const url = `https://www.openstreetmap.org/export/embed.html?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${lat},${lng}`;
            const openUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}`;
            wrapper.innerHTML = `<iframe id="osmFrame" src="${url}" style="border:0;width:100%;height:100%;" loading="lazy"></iframe><a class="osm-link" href="${openUrl}" target="_blank" rel="noopener" aria-label="Abrir mapa en OpenStreetMap">↗</a>`;
        }

        // Función para mostrar mensajes
        function showMessage(element, message, type = '') { element.innerHTML = `<span class="${type}">${message}</span>`; }

        // Geolocalización
        const getLocationBtn = document.getElementById('getLocation');
        const startTrackingBtn = document.getElementById('startTracking');
        const stopTrackingBtn = document.getElementById('stopTracking');
        const locationData = document.getElementById('locationData');

        if (!navigator.geolocation) { showMessage(locationData, 'Geolocalización no soportada en este navegador.', 'error'); getLocationBtn.disabled = startTrackingBtn.disabled = true; }

        function displayPosition(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const acc = position.coords.accuracy;
            const data = `Latitud: ${lat}\nLongitud: ${lng}\nPrecisión: ${acc} metros\nAltitud: ${position.coords.altitude || 'No disponible'}\nPrecisión altitud: ${position.coords.altitudeAccuracy || 'No disponible'}\nVelocidad: ${position.coords.speed || 'No disponible'} m/s\nDirección: ${position.coords.heading || 'No disponible'} grados\nTimestamp: ${new Date(position.timestamp).toLocaleString()}`;
            locationData.textContent = data;
            positions.push({ lat, lng });
            // Try to send to API (no auth in test server)
            try {
                fetch(API_BASE + '/api/sensors/positions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ device_id: 'web', lat, lng, accuracy: acc, ts: Date.now() }) });
            } catch (e) {
                // ignore
            }
            if (positions.length > 1) { const distance = calculateDistance(positions); locationData.textContent += `\nDistancia recorrida: ${distance.toFixed(2)} km`; }

            // Mostrar el contenedor del mapa y mostrar imagen estática centrada
            const mapWrapper = document.getElementById('mapWrapper');
            if (mapWrapper) {
                mapWrapper.style.display = 'block';
                showStaticMap(lat, lng, acc);
            }
        }

        function calculateDistance(positions) {
            let totalDistance = 0;
            for (let i = 1; i < positions.length; i++) {
                const prev = positions[i-1]; const curr = positions[i];
                const dLat = (curr.lat - prev.lat) * Math.PI / 180; const dLng = (curr.lng - prev.lng) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(prev.lat * Math.PI / 180) * Math.cos(curr.lat * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); totalDistance += 6371 * c;
            }
            return totalDistance;
        }

        function handleLocationError(error) {
            let message = '';
            switch(error.code) {
                case error.PERMISSION_DENIED: message = 'Permiso de ubicación denegado por el usuario.'; break;
                case error.POSITION_UNAVAILABLE: message = 'Ubicación no disponible.'; break;
                case error.TIMEOUT: message = 'Tiempo de espera agotado.'; break;
                default: message = 'Error desconocido.'; break;
            }
            showMessage(locationData, message, 'error');
            // Ocultar/limpiar mapa si hubo un error
            const mapWrapper = document.getElementById('mapWrapper');
            if (mapWrapper) { mapWrapper.style.display = 'none'; mapWrapper.innerHTML = '<div id="map"></div>'; }
            // Restaurar estado de botones
            try { getLocationBtn.disabled = false; startTrackingBtn.disabled = false; stopTrackingBtn.disabled = true; } catch (e) { /* ignore if elements not ready */ }
        }

        getLocationBtn.addEventListener('click', () => {
            // Pedir la ubicación; no inicializamos el mapa hasta recibirla
            locationData.textContent = 'Obteniendo ubicación...';
            getLocationBtn.disabled = true;
            navigator.geolocation.getCurrentPosition((pos) => {
                getLocationBtn.disabled = false;
                displayPosition(pos);
            }, (err) => {
                getLocationBtn.disabled = false;
                handleLocationError(err);
            }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
            navigator.geolocation.getCurrentPosition((pos) => {
                getLocationBtn.disabled = false;
                displayPosition(pos);
            }, (err) => {
                getLocationBtn.disabled = false;
                handleLocationError(err);
            }, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
        });

        startTrackingBtn.addEventListener('click', () => {
            locationData.textContent = 'Iniciando seguimiento...';
            watchId = navigator.geolocation.watchPosition(displayPosition, handleLocationError, { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 });
            stopTrackingBtn.disabled = false; startTrackingBtn.disabled = true;
        });

        stopTrackingBtn.addEventListener('click', () => { navigator.geolocation.clearWatch(watchId); watchId = null; stopTrackingBtn.disabled = true; startTrackingBtn.disabled = false; });

        // Cámara
        const startCameraBtn = document.getElementById('startCamera');
        const stopCameraBtn = document.getElementById('stopCamera');
        const captureImageBtn = document.getElementById('captureImage');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        startCameraBtn.addEventListener('click', async () => {
            try {
                const constraints = { video: { facingMode: 'environment' }, audio: true };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream; stopCameraBtn.disabled = false; startCameraBtn.disabled = true; captureImageBtn.disabled = false;
            } catch (error) { showMessage(document.querySelector('#video').parentElement, 'Error al acceder a la cámara: ' + error.message, 'error'); }
        });

        stopCameraBtn.addEventListener('click', () => { if (stream) { stream.getTracks().forEach(track => track.stop()); video.srcObject = null; stream = null; } stopCameraBtn.disabled = true; startCameraBtn.disabled = false; captureImageBtn.disabled = true; });

        captureImageBtn.addEventListener('click', () => { if (!stream) return; const context = canvas.getContext('2d'); canvas.width = video.videoWidth; canvas.height = video.videoHeight; context.drawImage(video, 0, 0); canvas.style.display = 'block'; });
    </script>
    <script>
    // Ir al panel principal preservando sesión (incluye user en la URL para compatibilidad WebView)
    function goPanel() {
        try {
            const current = localStorage.getItem('currentUser') || localStorage.getItem('rememberedUser') || 'user';
            if (current) localStorage.setItem('currentUser', current);
            const user = encodeURIComponent(current || 'user');
            window.location.href = 'login3.html?user=' + user + '#panel';
        } catch (e) {
            window.location.href = 'login3.html#panel';
        }
    }
    </script>
</body>
</html>
